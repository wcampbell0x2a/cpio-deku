name: release-plz

on:
  push:
    branches: [ master ]

permissions:
  contents: read

env:
  BINS: "uncpio-librarium"

jobs:
  # Publish the crates, create the tag, and create the GitHub release.
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Necessary for crates.io trusted publishing.
      id-token: write
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@8e61445f0b34e7c6d985255f2f1f05a36eb350dc # v0.5.137
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Open or update the release pull request with the version and changelog changes.
  release-plz-pr:
    name: release-plz pr
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Run release-plz
        uses: release-plz/action@8e61445f0b34e7c6d985255f2f1f05a36eb350dc # v0.5.137
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Attach the binaries to the release that release-plz created. The release is
  # not a draft, so this action can find it by tag and will not make a new one.
  release-bins:
    name: attach binaries
    needs: release-plz-release
    if: needs.release-plz-release.outputs.releases_created == 'true'
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: write
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
      BUILD_CMD: cargo
      TAG: ${{ fromJSON(needs.release-plz-release.outputs.releases)[0].tag }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-unknown-linux-musl,    os: ubuntu-24.04, use-cross: true }
          - { target: aarch64-unknown-linux-musl,   os: ubuntu-24.04, use-cross: true }
          - { target: arm-unknown-linux-musleabi,   os: ubuntu-24.04, use-cross: true }
          - { target: armv7-unknown-linux-musleabi, os: ubuntu-24.04, use-cross: true }
          - { target: x86_64-apple-darwin,          os: macos-14                       }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the released commit, not the most recent commit on master.
          ref: ${{ env.TAG }}
      - name: Populate cache
        uses: ./.github/workflows/cache

      - name: Overwrite build command env variable
        if: matrix.job.use-cross
        shell: bash
        run: |
          echo "BUILD_CMD=cross" >> $GITHUB_ENV
          RUSTFLAGS="-C target-feature=-crt-static" cargo install cross --git https://github.com/cross-rs/cross

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: ${{ matrix.job.target }}

      - run: $BUILD_CMD build -p librarium-cli --bin uncpio-librarium --locked --target ${{ matrix.job.target }} --profile=dist

      - name: archive
        run: |
          tar -czvf librarium-${{ matrix.job.target }}.tar.gz \
              -C target/${{ matrix.job.target }}/dist/ $BINS

      - name: Upload binary to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: librarium-${{ matrix.job.target }}.tar.gz
          asset_name: librarium-${{ env.TAG }}-${{ matrix.job.target }}.tar.gz
          tag: ${{ env.TAG }}
          overwrite: true
